name: Publish skills to Agent Plugins
description: Publishes every skill in the repository whose files changed to a marketplace team. On a pull request it only shows what would publish.
inputs:
  marketplace:
    description: The marketplace URL, for example https://marketplace.example.com.
    required: true
  namespace:
    description: The team the skills publish to. The workflow's repository must be a member (github:<owner>/<repo>).
    required: true
  path:
    description: The folder to publish, relative to the repository root.
    default: .
  dry-run:
    description: auto (a dry run on pull requests), true, or false.
    default: auto
  audience:
    description: The audience the OIDC token is minted for. Defaults to the marketplace URL, which is what the marketplace expects.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MARKETPLACE: ${{ inputs.marketplace }}
        NAMESPACE: ${{ inputs.namespace }}
        SKILLS_PATH: ${{ inputs.path }}
        DRY_RUN: ${{ inputs.dry-run }}
        AUDIENCE: ${{ inputs.audience || inputs.marketplace }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::The job can't sign in to the marketplace. Add 'permissions: id-token: write' to it. Pull requests from forks never can."
          exit 1
        fi
        if ! git rev-parse --verify -q HEAD > /dev/null; then
          echo "::error::There is no checkout to publish. Add actions/checkout before this step."
          exit 1
        fi

        token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
        echo "::add-mask::$token"
        dry=false
        if [ "$DRY_RUN" = true ] || { [ "$DRY_RUN" = auto ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; }; then
          dry=true
        fi

        archive="$RUNNER_TEMP/skills.zip"
        report="$RUNNER_TEMP/marketplace-report.md"
        git archive --format=zip -o "$archive" HEAD -- "$SKILLS_PATH"
        status=$(curl -sS -o "$report" -w '%{http_code}' \
          -H "Authorization: Bearer $token" -H "Accept: text/markdown" \
          -F "archive=@$archive;type=application/zip" -F "dryRun=$dry" \
          --form-string "changelog=$(git log -1 --format=%s)" \
          "${MARKETPLACE%/}/api/namespaces/$NAMESPACE/publish")

        case "$status" in
          200)
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            cat "$report"
            ;;
          422)
            if head -c 3 "$report" | grep -q '###'; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              cat "$report"
              echo "::error::Some skills failed the marketplace's checks, so nothing was published. The summary says which."
            else
              echo "::error::$(jq -r '[.title, .detail] | map(select(.)) | join(" ")' "$report")"
            fi
            exit 1
            ;;
          *)
            echo "::error::HTTP $status: $(jq -r '[.title, .detail] | map(select(.)) | join(" ")' "$report" 2> /dev/null || cat "$report")"
            exit 1
            ;;
        esac
