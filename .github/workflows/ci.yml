name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
      # The web portal (website/) ships inside the marketplace server image, so
      # one platform is enough; root format:check already covers its files.
      - name: Check the web portal
        if: runner.os == 'Linux'
        run: |
          pnpm --filter website lint
          pnpm --filter website test
          pnpm --filter website build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The marketplace server image builds the validator without the desktop
      # application; keep that configuration, and the other tools only it
      # builds, compiling and lint-clean too.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features tools --bins -- -D warnings

      - name: Build Windows application bundles
        if: runner.os == 'Windows'
        run: pnpm tauri build

      - name: Upload Windows application bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-application-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows native QA tests
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-qa-tests
          path: |
            src-tauri/target/debug/deps/agent_plugins_lib-*.exe
            src-tauri/target/debug/WebView2Loader.dll
          if-no-files-found: error
          retention-days: 7

  server:
    name: Marketplace server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Prettier formats the checked-in OpenAPI document.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the validator the server image ships
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features tools --bin validate-source

      - run: dotnet restore server/Marketplace.slnx
      - run: dotnet build server/Marketplace.slnx --no-restore -warnaserror

      - name: Check server/openapi.json is current
        run: |
          ASPNETCORE_ENVIRONMENT=Development Database__MigrateOnStartup=false Kestrel__Endpoints__Http__Url=http://127.0.0.1:5088 \
            dotnet run --project server/src/Marketplace.Api --no-build --no-launch-profile > /dev/null &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o server/openapi.json http://127.0.0.1:5088/openapi/v1.json
          kill $!
          pnpm exec prettier --write server/openapi.json
          git diff --exit-code server/openapi.json

      - name: Integration tests (PostgreSQL via Testcontainers, real validator)
        env:
          MARKETPLACE_VALIDATOR: ${{ github.workspace }}/src-tauri/target/debug/validate-source
        run: dotnet run --project server/tests/Marketplace.Api.Tests --no-build

      - name: Build the server image
        run: docker build -f server/Dockerfile -t marketplace-api:ci .
