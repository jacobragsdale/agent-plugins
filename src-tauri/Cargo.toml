[package]
name = "agent-plugins"
version = "0.2.1"
description = "A desktop app for installing Agent Skills and MCP servers"
authors = ["Jacob Ragsdale"]
edition = "2021"
default-run = "agent-plugins"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_plugins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable entry points contain no tests of their own. Keep the test
# suite on the library target where it belongs.
[[bin]]
name = "agent-plugins"
path = "src/main.rs"
test = false
bench = false
required-features = ["app"]

[features]
default = ["app"]
# The desktop application and its IPC surface. Disable it to build the
# validator binaries without Tauri; the marketplace server image does this so
# it needs no GTK or WebKit libraries.
app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-single-instance",
]
# The validator binaries and schema generator. Off by default so the app's
# installers do not ship them: Tauri bundles every binary cargo builds.
tools = []

[[bin]]
name = "agent-plugins-console"
path = "src/bin/agent-plugins-console.rs"
test = false
bench = false

[[bin]]
name = "generate-schema"
path = "src/bin/generate-schema.rs"
test = false
bench = false
required-features = ["tools"]

[[bin]]
name = "validate-source"
path = "src/bin/validate-source.rs"
test = false
bench = false
required-features = ["tools"]

[[bin]]
name = "validate-source-repository"
path = "src/bin/validate-source-repository.rs"
test = false
bench = false
required-features = ["tools"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
sha2 = "0.11"
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-opener = { version = "2.5.4", optional = true }
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
serde_yaml_ng = "0.10"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-manual-roots", "system-proxy"] }
base64 = "0.22"
zip = "2"
tar = "0.4"
flate2 = "1"
rustls-platform-verifier = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Same gate as CI `cargo clippy -- -D warnings`. Applies to rustc and to
# clippy, so `cargo check`, `cargo test`, and rust-analyzer fail locally
# instead of only on GitHub.
[lints.rust]
warnings = "deny"

# Agent Plugins spends its time hashing skill directories, so the release build
# is tuned for throughput and a small installer. `panic` is deliberately left
# unwinding: catalog work runs on blocking worker threads, and a panic there
# has to surface as an error rather than take the whole application down.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
